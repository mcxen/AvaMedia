name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget-packages
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.config', '**/nuget.config', 'global.json') }}
          restore-keys: nuget-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install external media tools
        shell: pwsh
        run: ./scripts/Install-MediaTools.ps1
      - name: Verify media, interfaces and UI
        shell: pwsh
        run: ./scripts/Verify.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification
          path: |
            artifacts/test-*/
            artifacts/editor-style-*/
            artifacts/theme-resources-*/
          retention-days: 14
