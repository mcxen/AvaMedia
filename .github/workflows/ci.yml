name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install external media tools
        shell: pwsh
        run: ./scripts/Install-MediaTools.ps1
      - name: Verify media, interfaces and UI
        shell: pwsh
        run: ./scripts/Verify.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification
          path: |
            artifacts/test-*/
            artifacts/editor-style-*/
            artifacts/theme-resources-*/
          retention-days: 14
