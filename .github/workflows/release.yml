name: Release
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Select a vMAJOR.MINOR.PATCH tag.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install external media tools
        shell: pwsh
        run: ./scripts/Install-MediaTools.ps1
      - name: Verify all suites
        shell: pwsh
        run: ./scripts/Verify.ps1
      - name: Publish and build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/Publish.ps1 -Runtime win-x64 -Version $env:RELEASE_VERSION
          ./scripts/Package-Windows.ps1 -Version $env:RELEASE_VERSION
          ./scripts/Verify-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-x64
          path: |
            artifacts/AvaMedia-*-win-x64.zip
            artifacts/AvaMedia-*-win-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-verification
          path: |
            artifacts/test-*/
            artifacts/installer-verification/
          retention-days: 14
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne 'tag' -or $env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Select a vMAJOR.MINOR.PATCH tag.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native build tools
        run: brew install cmake meson ninja pkgconf autoconf automake libtool
      - name: Build and verify ARM64 QuickJS for macOS 13.4
        shell: pwsh
        run: ./scripts/macos/Build-QuickJS.ps1
      - name: Build and verify custom ARM64 FFmpeg
        run: python3 scripts/macos/Build-FFmpeg.py
      - name: Install verified custom media tools
        run: |
          runtime=$(find artifacts -maxdepth 1 -name 'AvaMedia-FFmpeg-*-osx-arm64.tar.gz' -print)
          checksums=$(find artifacts -maxdepth 1 -name 'AvaMedia-FFmpeg-*-SHA256SUMS.txt' -print)
          bash scripts/Install-MediaTools-macOS.sh --archive "$runtime" --checksums "$checksums"
      - name: Build and check interfaces and skins natively
        run: |
          dotnet build AvaMedia.sln -c Release
          dotnet run --project tests/AvaMedia.InterfaceTests -c Release --no-build
          dotnet run --project tests/AvaMedia.SkinTests -c Release --no-build
      - name: Verify client media processing with the custom runtime
        run: |
          dotnet run --project tests/AvaMedia.AudioOptionsTests -c Release --no-build
          dotnet run --project tests/AvaMedia.SubtitleTests -c Release --no-build
          dotnet run --project tests/AvaMedia.BatchTests -c Release --no-build
          dotnet run --project tests/AvaMedia.AblationTests -c Release --no-build
      - name: Build app, PKG and DMG
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/Publish.ps1 -Runtime $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION
          ./scripts/Package-Mac.ps1 -Runtime $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION
      - name: Verify published app starts on macOS
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          bundles=(artifacts/release/"$RELEASE_VERSION"/"$RELEASE_RUNTIME-bundle"/*.app)
          app="${bundles[0]}/Contents/MacOS/AvaMedia.Desktop"
          "$app" --capture artifacts/mac-native > artifacts/mac-native.log 2>&1 &
          process=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$process" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$process" 2>/dev/null; then kill "$process"; cat artifacts/mac-native.log; exit 1; fi
          wait "$process"
          test -s artifacts/mac-native/main.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runtime }}
          path: |
            artifacts/AvaMedia-*-${{ matrix.runtime }}.zip
            artifacts/AvaMedia-*-${{ matrix.runtime }}.pkg
            artifacts/AvaMedia-*-${{ matrix.runtime }}.dmg
            artifacts/AvaMedia-FFmpeg-*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-proof-${{ matrix.runtime }}
          include-hidden-files: true
          path: |
            artifacts/mac-native*/
            artifacts/mac-native.log
            artifacts/skins-*/
            artifacts/ffmpeg-build-*/*.log
            .tools/download-bundle/*-qjs-osx-arm64-macos*/build.json
            artifacts/ablation-*/
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Verify macOS archive architectures and permissions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: ./scripts/Verify-MacPackages.ps1 -Version $env:RELEASE_VERSION
      - name: Create source archive and checksums
        env:
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          git archive --format=zip --output="artifacts/AvaMedia-$RELEASE_VERSION-source.zip" HEAD
          cd artifacts
          sha256sum AvaMedia-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/AvaMedia-* artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/AvaMedia-* artifacts/SHA256SUMS.txt --verify-tag --title "AvaMedia $RELEASE_TAG" --generate-notes --notes-file docs/RELEASE-NOTES.md
          fi
