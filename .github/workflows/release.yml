name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild with this workflow
        type: string
        required: false
      windows_compile_flags:
        description: Windows compiler flags for a build repair
        type: string
        required: false
        default: /utf-8
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget-packages
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Read release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Select a vMAJOR.MINOR.PATCH tag.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          $notes = "docs/releases/$($Matches[1]).md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Missing release notes: $notes. Commit them before tagging." }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) { throw "Release notes are empty: $notes" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/nuget-packages
          key: nuget-v3-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/*.targets', '**/NuGet.config', '**/nuget.config', 'global.json') }}
          restore-keys: nuget-v3-${{ runner.os }}-
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish shared browser app and licenses
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/AvaMedia.Browser/AvaMedia.Browser.csproj -c Release "-p:Version=$env:RELEASE_VERSION" --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Browser publish failed.' }
          New-Item -ItemType Directory -Path artifacts/browser -Force | Out-Null
          Copy-Item src/AvaMedia.Browser/bin/Release/net8.0-browser/publish/wwwroot artifacts/browser/ -Recurse
          Get-ChildItem artifacts/browser/wwwroot -Recurse -File | Where-Object { $_.Extension -in @('.gz','.br') } | Remove-Item
          ./scripts/Collect-Licenses.ps1 -Project src/AvaMedia.Browser/AvaMedia.Browser.csproj -Runtime browser-wasm -OutputDirectory artifacts/browser/licenses
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-publish
          path: artifacts/browser/
          if-no-files-found: error
  windows-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/native-media-windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-media-win-x64
          compression-level: 0
          path: |
            artifacts/AvaMedia-FFmpeg-*-win-x64.zip
            artifacts/AvaMedia-FFmpeg-*-win-x64-SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-media-source-win-x64
          compression-level: 0
          path: artifacts/AvaMedia-FFmpeg-*-win-x64-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-media-build-logs
          path: artifacts/ffmpeg-win-build-*/*.log
  windows:
    needs: [windows-media, browser]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CL: ${{ inputs.windows_compile_flags || '/utf-8' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Read release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Select a vMAJOR.MINOR.PATCH tag.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/nuget-packages
          key: nuget-v3-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/*.targets', '**/NuGet.config', '**/nuget.config', 'global.json') }}
          restore-keys: nuget-v3-${{ runner.os }}-
      - name: Download Windows media runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-media-win-x64
          path: artifacts
      - name: Download shared browser app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-publish
          path: artifacts/browser
      - name: Stage shared browser app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src/AvaMedia.Browser/bin/Release/net8.0-browser/publish -Force | Out-Null
          Copy-Item artifacts/browser/wwwroot src/AvaMedia.Browser/bin/Release/net8.0-browser/publish/ -Recurse
      - name: Publish and build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/Publish.ps1 -Runtime win-x64 -Version $env:RELEASE_VERSION -SkipBrowser -BrowserLicenseDirectory artifacts/browser/licenses
          ./scripts/Package-Windows.ps1 -Version $env:RELEASE_VERSION
          ./scripts/Verify-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-x64
          compression-level: 0
          path: |
            artifacts/AvaMedia-*-win-x64-portable.zip
            artifacts/AvaMedia-*-win-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-verification
          path: |
            artifacts/installer-verification/
          retention-days: 14
  macos:
    needs: browser
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Read release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Select a vMAJOR.MINOR.PATCH tag.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/nuget-packages
          key: nuget-v3-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/*.targets', '**/NuGet.config', '**/nuget.config', 'global.json') }}
          restore-keys: nuget-v3-${{ runner.os }}-
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare verified native media
        uses: ./.github/actions/native-media
      - name: Download shared browser app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-publish
          path: artifacts/browser
      - name: Stage shared browser app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src/AvaMedia.Browser/bin/Release/net8.0-browser/publish -Force | Out-Null
          Copy-Item artifacts/browser/wwwroot src/AvaMedia.Browser/bin/Release/net8.0-browser/publish/ -Recurse
      - name: Build app and DMG
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/Publish.ps1 -Runtime $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION -SkipBrowser -BrowserLicenseDirectory artifacts/browser/licenses
          ./scripts/Package-Mac.ps1 -Runtime $env:RELEASE_RUNTIME -Version $env:RELEASE_VERSION
      - name: Verify macOS archive architectures and permissions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Verify-MacPackages.ps1 -Version $env:RELEASE_VERSION
      - name: Verify published app starts on macOS
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          bundles=(artifacts/release/"$RELEASE_VERSION"/"$RELEASE_RUNTIME-bundle"/*.app)
          app="${bundles[0]}/Contents/MacOS/AvaMedia.Desktop"
          "$(dirname "$app")/tools/ffmpeg" -version
          "$(dirname "$app")/tools/ffprobe" -version
          "$app" --capture artifacts/mac-native > artifacts/mac-native.log 2>&1 &
          process=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$process" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$process" 2>/dev/null; then kill "$process"; cat artifacts/mac-native.log; exit 1; fi
          wait "$process"
          test -s artifacts/mac-native/main.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runtime }}
          compression-level: 0
          path: |
            artifacts/AvaMedia-*-${{ matrix.runtime }}.dmg
            artifacts/AvaMedia-FFmpeg-*-osx-arm64.tar.gz
            artifacts/AvaMedia-FFmpeg-*-SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-media-source-${{ matrix.runtime }}
          compression-level: 0
          path: artifacts/AvaMedia-FFmpeg-*-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-proof-${{ matrix.runtime }}
          include-hidden-files: true
          path: |
            artifacts/mac-native*/
            artifacts/mac-packages-*/report.json
            artifacts/mac-native.log
            artifacts/ffmpeg-build-*/*.log
            artifacts/ffmpeg-cache-verification.json
            .tools/download-bundle/*-qjs-osx-arm64-macos*/build.json
  linux:
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Read release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Select a vMAJOR.MINOR.PATCH tag.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/nuget-packages
          key: nuget-v3-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/*.targets', '**/NuGet.config', '**/nuget.config', 'global.json') }}
          restore-keys: nuget-v3-${{ runner.os }}-
      - name: Download shared browser app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-publish
          path: artifacts/browser
      - name: Stage shared browser app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src/AvaMedia.Browser/bin/Release/net8.0-browser/publish -Force | Out-Null
          Copy-Item artifacts/browser/wwwroot src/AvaMedia.Browser/bin/Release/net8.0-browser/publish/ -Recurse
      - name: Build self-contained Linux archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Package-Linux.sh "$RELEASE_VERSION" --skip-browser --browser-licenses "$GITHUB_WORKSPACE/artifacts/browser/licenses"
      - name: Verify published app starts on Linux
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libice6 libsm6 libfontconfig1 > /dev/null
          mkdir -p artifacts/linux-check
          tar -C artifacts/linux-check -xzf "artifacts/AvaMedia-$RELEASE_VERSION-linux-x64.tar.gz"
          app="artifacts/linux-check/AvaMedia-$RELEASE_VERSION-linux-x64/avamedia"
          timeout 120 xvfb-run -a "$app" --capture artifacts/linux-native > artifacts/linux-native.log 2>&1 || { cat artifacts/linux-native.log; exit 1; }
          test -s artifacts/linux-native/main.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          compression-level: 0
          path: artifacts/AvaMedia-*-linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-proof
          path: |
            artifacts/linux-native/
            artifacts/linux-native.log
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish installers and corresponding media sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: ./scripts/Publish-Release.ps1 -Version $env:RELEASE_VERSION -Revision (git rev-parse HEAD) -Repository $env:GH_REPO
