<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>{{APP_NAME}} · WiFi 传文件</title>
  <style nonce="{{NONCE}}">
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; background: #eef3f8; color: #172538; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px max(24px, env(safe-area-inset-bottom)); }
    main { max-width: 680px; margin: auto; }
    header { margin: 12px 0 24px; }
    h1 { font-size: 28px; margin: 8px 0; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    p { line-height: 1.65; margin: 8px 0; }
    .eyebrow { color: #366aa2; font-weight: 650; }
    .card { background: #fff; border: 1px solid #dbe3ed; border-radius: 18px; padding: 20px; margin-bottom: 18px; }
    .muted { color: #5b6b7d; font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    button, .picker, .download { font: inherit; border-radius: 10px; border: 1px solid #bbccde; padding: 12px 16px; min-height: 46px; background: #f0f5fa; color: #1c4e80; cursor: pointer; text-align: center; }
    button, .picker, .download { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .icon-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .action-icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .primary { background: #1769b3; border-color: #1769b3; color: white; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, .picker:focus-within, a:focus-visible { outline: 3px solid #f4a928; outline-offset: 3px; }
    .picker { display: inline-flex; position: relative; overflow: hidden; align-items: center; }
    .picker input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
    .picker:has(input:disabled) { opacity: .5; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 12px 0; border-bottom: 1px solid #e5ebf1; display: flex; align-items: center; gap: 12px; }
    li:last-child { border-bottom: 0; }
    .info { flex: 1; min-width: 0; }
    .name { display: block; overflow-wrap: anywhere; line-height: 1.5; }
    .state { display: block; margin-top: 4px; font-size: 13px; color: #5b6b7d; }
    .error { color: #ba3535; }
    .success { color: #208251; }
    progress { width: 100%; height: 14px; accent-color: #1769b3; }
    .download { text-decoration: none; padding: 10px 12px; flex-shrink: 0; }
    .small { padding: 6px 10px; min-height: 36px; font-size: 14px; }
    .identity { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .identity input { font: inherit; flex: 1; min-width: 160px; min-height: 46px; padding: 10px 12px; border: 1px solid #bbccde; border-radius: 10px; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      :root { background: #111b28; color: #edf4fb; }
      .card { background: #1b2a3b; border-color: #33495e; }
      .muted, .state { color: #b1c1d1; }
      .eyebrow { color: #8ac4fa; }
      button, .picker, .download { background: #273e55; border-color: #496682; color: #d2e8ff; }
      .primary { background: #1769b3; border-color: #1769b3; color: white; }
      li { border-color: #33495e; }
      .error { color: #ff9a9a; }
      .success { color: #8be0ac; }
    }
  </style>
</head>
<body>
<!-- Local Lucide 1.55.0 SVGs; source hashes and ISC/MIT attribution: Assets/ToolbarIcons/Lucide/sources.json, licenses/lucide. -->
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
  <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" />
  <path d="M7 3v4a1 1 0 0 0 1 1h7" />
    </symbol>
    <symbol id="icon-image-plus" viewBox="0 0 24 24">
      <path d="M16 5h6" />
  <path d="M19 2v6" />
  <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" />
  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
  <circle cx="9" cy="9" r="2" />
    </symbol>
    <symbol id="icon-file-plus" viewBox="0 0 24 24">
      <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M9 15h6" />
  <path d="M12 18v-6" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 3v12" />
  <path d="m17 8-5-5-5 5" />
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18" />
  <path d="m6 6 12 12" />
    </symbol>
    <symbol id="icon-list-x" viewBox="0 0 24 24">
      <path d="M16 5H3" />
  <path d="M11 12H3" />
  <path d="M16 19H3" />
  <path d="m15.5 9.5 5 5" />
  <path d="m20.5 9.5-5 5" />
    </symbol>
    <symbol id="icon-refresh-cw" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" />
    </symbol>
    <symbol id="icon-list-minus" viewBox="0 0 24 24">
      <path d="M16 5H3" />
  <path d="M11 12H3" />
  <path d="M16 19H3" />
  <path d="M21 12h-6" />
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 15V3" />
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  <path d="m7 10 5 5 5-5" />
    </symbol>
  </defs>
</svg>
<main>
  <header>
    <div class="eyebrow">{{APP_NAME}} · 局域网直传</div>
    <h1>WiFi 传文件</h1>
  </header>
  <section class="card" aria-labelledby="user-title">
    <h2 id="user-title">我的传输用户</h2>
    <div class="identity">
      <label for="user-name">用户名称</label>
      <input id="user-name" maxlength="32" autocomplete="nickname" placeholder="输入姓名或设备名称">
      <button id="save-user"><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-save"/></svg>保存名称</button>
    </div>
    <p id="user-status" class="muted" role="status" aria-live="polite">正在连接电脑…</p>
    <p class="muted">多位用户可同时上传和下载，电脑左侧按用户查看媒体。空闲 5 分钟后可自动关闭传输，进行中的传输会保持连接。</p>
  </section>
  <section class="card" aria-labelledby="upload-title">
    <h2 id="upload-title">发送到电脑</h2>
    <p class="muted">单个文件最大 50 GB</p>
    <div class="actions">
      <label class="picker"><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-image-plus"/></svg>从相册选择<input id="photos" type="file" accept="image/*,video/*" multiple aria-label="从相册选择照片和视频"></label>
      <label class="picker"><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-file-plus"/></svg>从文件选择<input id="files" type="file" multiple aria-label="从文件选择"></label>
    </div>
    <p class="muted">iPhone：需保留原始 MOV / HEIC，可先从相册存储到“文件”，再选择“从文件选择”上传。</p>
    <ul id="selection" aria-label="待发送文件"></ul>
    <div class="actions">
      <button class="primary" id="upload" disabled><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-upload"/></svg>开始上传</button>
      <button id="cancel" hidden><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-x"/></svg>取消传输</button>
      <button id="clear" disabled><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-list-x"/></svg>清空列表</button>
    </div>
    <progress id="progress" max="100" value="0" hidden aria-label="当前文件上传进度"></progress>
    <p id="status" role="status" aria-live="polite">尚未选择文件</p>
    <p class="muted">传输时保持页面在前台</p>
  </section>
  <section class="card" aria-labelledby="download-title">
    <h2 id="download-title">从电脑下载</h2>
    <p class="muted">所有连接用户均可下载</p>
    <ul id="downloads" aria-label="电脑分享的文件"></ul>
    <p id="download-status" class="muted" role="status">正在连接电脑…</p>
    <button id="refresh" class="small"><svg class="action-icon" aria-hidden="true" focusable="false"><use href="#icon-refresh-cw"/></svg>刷新文件列表</button>
  </section>
  <p class="muted">这是临时 HTTP 局域网传输，请在可信网络中使用。电脑关闭接收后，当前扫码地址失效。</p>
</main>
<script nonce="{{NONCE}}">
  'use strict';
  const base = location.pathname.replace(/\/?$/, '/');
  const get = id => document.getElementById(id);
  function actionLabel(element, kind, label) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'action-icon'); svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('focusable', 'false');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#icon-' + kind); svg.append(use);
    element.replaceChildren(svg, document.createTextNode(label));
  }
  const selections = [];
  let busy = false, cancelled = false, currentRequest = null, refreshing = false;
  let sessionReady = false, connecting = null;
  const maxBytes = 50 * 1024 * 1024 * 1024;
  function bytes(value) {
    if (value < 1024) return value + ' B';
    const units = ['KB', 'MB', 'GB'];
    let scaled = value / 1024, index = 0;
    while (scaled >= 1024 && index < 2) { scaled /= 1024; index++; }
    return scaled.toFixed(scaled < 10 ? 2 : 1) + ' ' + units[index];
  }
  function controls() {
    get('save-user').disabled = busy || connecting !== null;
    get('user-name').disabled = busy || connecting !== null;
    get('photos').disabled = get('files').disabled = busy;
    get('upload').disabled = busy || !sessionReady || !selections.some(item => !item.done && item.file.size <= maxBytes);
    get('clear').disabled = busy || selections.length === 0;
    get('cancel').hidden = !busy;
    get('progress').hidden = !busy;
  }
  try { get('user-name').value = localStorage.getItem('avamedia-wifi-name') || ''; } catch { }
  async function connect(name = get('user-name').value) {
    if (connecting) return connecting;
    connecting = (async () => {
      const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch(base + 'session', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }), signal: controller.signal, cache: 'no-store'
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '连接失败，请重新扫码。');
        sessionReady = true; get('user-name').value = result.name;
        try { localStorage.setItem('avamedia-wifi-name', result.name); } catch { }
        get('user-status').textContent = '已连接：' + result.name + ' · 文件会归入此用户。';
      } catch (error) {
        get('user-status').textContent = error.name === 'AbortError' || error instanceof TypeError || error instanceof SyntaxError ?
          '无法连接电脑，传输可能已关闭，请检查网络并重新扫码。' : error.message;
        throw new Error(get('user-status').textContent);
      } finally { clearTimeout(timeout); }
    })();
    controls();
    try { await connecting; } finally { connecting = null; controls(); }
  }
  get('save-user').addEventListener('click', async () => {
    try { await connect(); await refresh(); } catch { }
  });
  function renderSelections() {
    get('selection').replaceChildren();
    selections.forEach(item => {
      const row = document.createElement('li'), info = document.createElement('div');
      info.className = 'info';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = item.file.name;
      item.state = document.createElement('span'); item.state.className = 'state';
      info.append(name, item.state); row.append(info); updateState(item);
      const remove = document.createElement('button'); remove.className = 'small'; actionLabel(remove, 'list-minus', '移除'); remove.disabled = busy;
      remove.addEventListener('click', () => { selections.splice(selections.indexOf(item), 1); renderSelections(); });
      row.append(remove); get('selection').append(row);
    });
    controls();
  }
  function updateState(item) {
    item.state.textContent = bytes(item.file.size) + ' · ' + item.message;
    item.state.className = 'state' + (item.done ? ' success' : item.error ? ' error' : '');
  }
  function select(event) {
    for (const file of event.target.files) {
      const tooLarge = file.size > maxBytes;
      selections.push({ file, done: false, error: tooLarge, message: tooLarge ? '超过单文件 50 GB 上限' : '等待上传' });
    }
    event.target.value = ''; renderSelections();
  }
  get('photos').addEventListener('change', select); get('files').addEventListener('change', select);
  get('clear').addEventListener('click', () => { selections.length = 0; get('status').textContent = '尚未选择文件'; renderSelections(); });
  get('cancel').addEventListener('click', () => { cancelled = true; if (currentRequest) currentRequest.abort(); });
  function send(item, index, total) {
    return new Promise((resolve, reject) => {
      const request = new XMLHttpRequest(); currentRequest = request;
      request.open('POST', base + 'upload');
      request.setRequestHeader('Content-Type', 'application/octet-stream');
      request.setRequestHeader('X-File-Name', encodeURIComponent(item.file.name));
      request.upload.onprogress = event => {
        const percent = event.lengthComputable && event.total ? Math.min(100, Math.round(event.loaded / event.total * 100)) : 0;
        get('progress').value = percent;
        get('status').textContent = '正在上传 ' + index + '/' + total + '：' + item.file.name + ' · ' + percent + '%';
        item.message = percent === 100 ? '电脑正在确认接收…' : '上传中 ' + percent + '%'; updateState(item);
      };
      request.onload = () => {
        let result; try { result = JSON.parse(request.responseText); } catch { result = {}; }
        if (request.status >= 200 && request.status < 300 && result.bytes === item.file.size) resolve();
        else reject(new Error(result.error || '接收未确认。请检查电脑是否仍开启接收，再重试。'));
      };
      request.onerror = () => reject(new Error('连接中断，请检查 WiFi 和电脑接收状态后重试。'));
      request.onabort = () => reject(new Error('已取消，可重新上传。'));
      request.send(item.file);
    });
  }
  get('upload').addEventListener('click', async () => {
    const pending = selections.filter(item => !item.done && item.file.size <= maxBytes);
    busy = true; cancelled = false; renderSelections(); let succeeded = 0, failed = 0;
    try {
      if (!sessionReady) await connect();
      for (let index = 0; index < pending.length && !cancelled; index++) {
        const item = pending[index]; item.error = false; item.message = '正在连接电脑…'; updateState(item);
        get('progress').value = 0; get('status').textContent = '正在上传：' + item.file.name;
        try { await send(item, index + 1, pending.length); item.done = true; item.message = '已完整保存到电脑'; succeeded++; }
        catch (error) { item.error = true; item.message = error.message; failed++; }
        finally { currentRequest = null; updateState(item); }
        if (cancelled) break;
      }
      get('status').textContent = cancelled ? '传输已取消。已成功上传的文件保留在电脑上。' :
        '本次完成 ' + succeeded + ' 个文件' + (failed ? '，失败 ' + failed + ' 个；点击开始上传可重试。' : '');
    } catch (error) { get('status').textContent = error.message; }
    finally { busy = false; renderSelections(); }
  });
  async function refresh() {
    if (refreshing) return;
    refreshing = true; const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      if (!sessionReady) await connect();
      const response = await fetch(base + 'files', { cache: 'no-store', signal: controller.signal });
      if (!response.ok) {
        sessionReady = false; controls();
        throw new Error('电脑传输已关闭或地址已失效，请重新扫码。');
      }
      const files = await response.json(); get('downloads').replaceChildren();
      for (const file of files) {
        const row = document.createElement('li'), info = document.createElement('div'); info.className = 'info';
        const name = document.createElement('span'); name.className = 'name'; name.textContent = file.name;
        const size = document.createElement('span'); size.className = 'state'; size.textContent = bytes(file.bytes);
        info.append(name, size); const link = document.createElement('a'); link.className = 'download';
        actionLabel(link, 'download', '下载'); link.href = base + 'download/' + encodeURIComponent(file.id); link.download = file.name;
        row.append(info, link); get('downloads').append(row);
      }
      get('download-status').textContent = files.length ? '电脑已分享 ' + files.length + ' 个文件。' : '电脑尚未添加分享文件。';
    } catch (error) {
      sessionReady = false; controls();
      get('downloads').replaceChildren();
      get('download-status').textContent = error.message === 'Failed to fetch' || error.name === 'AbortError' ?
        '无法连接电脑，请检查同一 WiFi、电脑接收状态和防火墙，然后重新扫码。' : error.message;
    } finally { clearTimeout(timeout); refreshing = false; }
  }
  get('refresh').addEventListener('click', refresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  setInterval(() => { if (!document.hidden) refresh(); }, 6000);
  refresh();
</script>
</body>
</html>
